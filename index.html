<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#F6E3C0">
<title>Catch the Cendol — Rainbow Ice Parlour &amp; Coffee House</title>
<style>
  :root{
    --cream:#FFF8E9;
    --cream2:#FBE7C2;
    --mint:#6BC8AC;
    --mint-d:#3FA88B;
    --brown:#8A5A38;
    --brown-d:#5E3A22;
    --gold:#F6C45C;
    --pink:#FF9FB2;
    --coral:#FF8A72;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{margin:0;padding:0;height:100%;overflow:hidden;}
  body{
    background:radial-gradient(circle at 50% 10%,#F7D9A8 0%,#D8AE7C 55%,#9C6C45 100%);
    font-family:"PingFang SC","Hiragino Sans GB","Microsoft YaHei",-apple-system,BlinkMacSystemFont,"Arial Rounded MT Bold",sans-serif;
    display:flex;align-items:center;justify-content:center;
    user-select:none;-webkit-user-select:none;
  }
  #wrap{
    position:relative;width:min(100vw,56vh,460px);aspect-ratio:420/720;max-height:100vh;
    overflow:hidden;border-radius:22px;background:var(--cream);
    box-shadow:0 24px 60px rgba(60,35,18,.45),0 0 0 4px #FFF3D6,0 0 0 7px #C7915C;
    touch-action:none;
  }
  canvas#game{display:block;width:100%;height:100%;}

  /* ---------- HOME ---------- */
  #home{
    position:absolute;inset:0;z-index:20;display:flex;flex-direction:column;
    align-items:center;justify-content:space-between;padding:16px 16px 24px;
    background-color:#FBE7C2;background-size:cover;background-position:center 45%;
  }
  #home::before{
    content:"";position:absolute;inset:0;pointer-events:none;
    background:linear-gradient(180deg,rgba(255,250,235,.55) 0%,rgba(255,250,235,.10) 42%,rgba(94,58,34,.18) 100%);
  }
  #home::after{
    content:"";position:absolute;inset:10px;border-radius:18px;pointer-events:none;
    border:3px dashed rgba(255,255,255,.75);
  }
  .home-top{position:relative;z-index:2;display:flex;flex-direction:column;align-items:center;width:100%;padding-top:6px;}
  #logo{
    width:142px;height:142px;object-fit:contain;background:transparent;
    padding:0;border:0;border-radius:0;box-shadow:none;
    transform:rotate(-3deg);
  }
  .title-bubble{
    margin-top:28px;text-align:center;line-height:1;
    font-family:"Arial Rounded MT Bold","Hiragino Maru Gothic ProN","Yuanti SC","PingFang SC",sans-serif;
    transform:rotate(-1deg);
  }
  .ice-title{position:relative;display:inline-block;padding:6px 8px 12px;white-space:nowrap;}
  .home-bottom{position:relative;z-index:2;width:100%;display:flex;flex-direction:column;align-items:center;}
  .cloud-note{
    padding:7px 14px;margin-bottom:14px;border-radius:16px;
    background:rgba(255,255,255,.9);border:2px solid #fff;
    color:#A07046;font-size:10.5px;font-weight:700;text-align:center;
    box-shadow:0 4px 0 rgba(138,90,56,.28);
  }
  .big-btn{
    width:88%;max-width:320px;padding:15px 10px;border:none;cursor:pointer;
    font-family:inherit;font-size:19px;font-weight:900;letter-spacing:2px;color:#fff;
    border-radius:18px;background:linear-gradient(180deg,#79D6B8,#3FA88B);
    border:3px solid #fff;
    box-shadow:0 7px 0 #2C7C66,0 12px 22px rgba(60,35,18,.3);
    transition:transform .08s,box-shadow .08s;
  }
  .big-btn:active{transform:translateY(5px);box-shadow:0 2px 0 #2C7C66;}
  .big-btn.alt{background:linear-gradient(180deg,#FFD98A,#F0B84E);box-shadow:0 6px 0 #C58C2E,0 10px 20px rgba(60,35,18,.25);color:#6E421F;}
  .big-btn.alt:active{box-shadow:0 1px 0 #C58C2E;}
  .big-btn.ghost{background:linear-gradient(180deg,#FFF9EC,#F3DFBC);box-shadow:0 6px 0 #D5B283;color:#8A5A38;}
  .big-btn.ghost:active{box-shadow:0 1px 0 #D5B283;}

  /* ---------- HUD ---------- */
  #hud{
    position:absolute;top:0;left:0;right:0;z-index:8;height:88px;
    display:flex;align-items:flex-start;justify-content:space-between;padding:10px 12px 0;
    pointer-events:none;
    background:linear-gradient(180deg,rgba(94,58,34,.9) 0%,rgba(94,58,34,.45) 65%,rgba(94,58,34,0) 100%);
    color:#FFF7E4;
  }
  .stat .lbl{font-size:8.5px;letter-spacing:1.3px;opacity:.78;display:block;line-height:1;}
  .stat .val{font-size:24px;font-weight:900;line-height:1.15;text-shadow:0 2px 0 rgba(0,0,0,.25);}
  .stat .best{font-size:12px;font-weight:800;color:#FFE6A6;}
  .hud-mid{flex:1;text-align:center;padding-top:6px;}
  #comboBadge{
    display:inline-block;padding:4px 10px;border-radius:999px;font-size:10.5px;font-weight:900;
    background:rgba(255,255,255,.16);border:1px solid rgba(255,255,255,.3);transition:.2s;
  }
  #comboBadge b{font-size:15px;color:#FFE9A8;}
  #comboBadge.hot{background:linear-gradient(90deg,#F6C45C,#FFE6A8);color:#6E421F;border-color:#fff;box-shadow:0 0 16px rgba(255,214,110,.9);}
  #comboBadge.hot b{color:#8A4A18;}
  .hud-right{text-align:right;min-width:120px;}
  #hearts{display:flex;gap:2px;justify-content:flex-end;margin-bottom:6px;}
  #hearts img{width:22px;height:22px;filter:drop-shadow(0 2px 1px rgba(0,0,0,.25));}
  .icon-row{display:flex;gap:5px;justify-content:flex-end;pointer-events:auto;}
  .icobtn{
    width:32px;height:32px;border-radius:11px;border:2px solid rgba(255,255,255,.6);
    background:rgba(255,255,255,.2);color:#fff;font-size:14px;font-weight:900;cursor:pointer;
    display:flex;align-items:center;justify-content:center;padding:0;
  }
  .icobtn:active{transform:scale(.92);background:rgba(255,255,255,.35);}
  .icobtn svg{width:16px;height:16px;fill:#fff;}

  /* ---------- Overlays ---------- */
  .overlay{
    position:absolute;inset:0;z-index:15;display:flex;align-items:center;justify-content:center;padding:14px;
    background:rgba(70,44,25,.48);backdrop-filter:blur(3px);-webkit-backdrop-filter:blur(3px);
  }
  .hidden{display:none !important;}
  .card{
    width:100%;max-width:360px;max-height:100%;overflow-y:auto;text-align:center;
    background:linear-gradient(180deg,#FFFDF5,#FBE9C9);
    border:3px solid #fff;border-radius:24px;padding:18px;
    box-shadow:0 14px 0 rgba(94,58,34,.35),0 20px 34px rgba(40,24,12,.28);
  }
  .card h2{margin:8px 0 12px;font-size:24px;color:var(--brown-d);}
  .card p{color:#9A724D;font-size:12px;line-height:1.6;}
  .emoji-art{width:76px;height:76px;margin:0 auto;}
  .result-box{display:flex;gap:8px;margin:12px 0;}
  .result-box div{flex:1;background:#fff;border:2px solid #F0DDBE;border-radius:14px;padding:8px 4px;}
  .result-box span{display:block;font-size:9px;color:#A7855F;letter-spacing:1px;}
  .result-box b{display:block;font-size:23px;color:var(--brown-d);}
  .rank{
    display:inline-block;margin:2px 0 8px;padding:8px 14px;border-radius:14px;
    background:linear-gradient(135deg,#FFF0C6,#FFD98A);border:2px solid #fff;
    color:#8A4A18;font-size:17px;font-weight:900;box-shadow:0 4px 0 #D8A44C;
  }
  .newbest{display:inline-block;margin-bottom:8px;padding:3px 10px;border-radius:999px;background:#FFE08A;color:#8A4A18;font-size:10px;font-weight:900;}
  .btn-stack{display:flex;flex-direction:column;gap:10px;margin-top:14px;}
  .btn-stack button{width:100%;}
  .guide-grid{display:grid;grid-template-columns:1fr 1fr;gap:7px;margin-top:12px;text-align:left;}
  .grow{display:flex;align-items:center;gap:7px;background:#fff;border:2px solid #F0DDBE;border-radius:12px;padding:6px 7px;font-size:10.5px;color:#7A5233;}
  .grow canvas{width:36px;height:36px;flex:none;}
  .grow .nm{flex:1;line-height:1.25;}
  .grow .pt{font-weight:900;color:#B4763A;white-space:nowrap;}
  .tip{font-size:10.5px;color:#A7855F;margin:10px 0 0;}

  /* ---------- Toast ---------- */
  #toast{
    position:absolute;left:50%;bottom:96px;transform:translateX(-50%) scale(.9);
    z-index:12;padding:8px 14px;border-radius:999px;background:rgba(94,58,34,.9);
    color:#FFF6E2;font-size:11px;font-weight:800;opacity:0;transition:.25s;pointer-events:none;white-space:nowrap;
  }
  #toast.show{opacity:1;transform:translateX(-50%) scale(1);}
</style>
<style>
/* ===== 3D 卡通风升级 ===== */
body{background:radial-gradient(circle at 50% 8%,#FFE7BC 0%,#E8BC8C 45%,#A8744E 100%);}
#wrap{perspective:1000px;box-shadow:0 26px 64px rgba(60,35,18,.5),0 0 0 4px #FFF3D6,0 0 0 8px #C7915C,0 0 0 12px rgba(255,255,255,.22);}
#home{perspective:1100px;transform-style:preserve-3d;padding:14px 16px 52px;}
#home::before{background:linear-gradient(180deg,rgba(255,250,235,.34),rgba(255,235,200,.1) 45%,rgba(94,58,34,.26));}
#home::after{border:4px solid rgba(255,255,255,.85);box-shadow:inset 0 0 0 3px rgba(246,196,92,.6),0 0 22px rgba(255,255,255,.38);}
.home-top{transform:translateZ(18px) rotateX(2deg);transform-style:preserve-3d;}
#logo{
  width:176px;height:176px;object-fit:contain;background:transparent;padding:0;border:0;border-radius:0;box-shadow:none;
  transform:rotate(-4deg) translateZ(10px);
  filter:drop-shadow(0 7px 10px rgba(90,45,25,.28)) saturate(1.1);
}
.title-bubble{position:relative;transform:rotate(-1deg) translateZ(22px);}
.ice-title{
  position:relative;display:inline-block;padding:16px 16px 24px;white-space:nowrap;
}
.tline{display:block;line-height:.94;}
.tline.l1{font-size:36px;}
.tline.l2{font-size:54px;}
.ice-title .word{
  display:inline-block;margin-right:.14em;
  font-family:"Arial Rounded MT Bold","Hiragino Maru Gothic ProN","Yuanti SC","PingFang SC",sans-serif;
  font-weight:900;letter-spacing:-1.2px;
  color:transparent;-webkit-text-fill-color:transparent;
  -webkit-background-clip:text;background-clip:text;
  -webkit-text-stroke:4px #7A3B22;
  filter:drop-shadow(0 3px 0 #FFF6DC) drop-shadow(0 6px 0 #C4622F) drop-shadow(0 11px 8px rgba(70,30,15,.38));
  transform:rotate(var(--r)) translateY(var(--y));
}
.ice-title .word:last-child{margin-right:0;}
.ice-title .w1{--r:-4deg;--y:2px;background-image:linear-gradient(180deg,#FFF3CB 0%,#FFB14E 45%,#EF6A2E 100%);}
.ice-title .w2{--r:4deg;--y:-2px;background-image:linear-gradient(180deg,#FFF9D4 0%,#FFD73E 48%,#E8A400 100%);}
.ice-title .w3{--r:-2deg;--y:1px;background-image:linear-gradient(180deg,#FFF0F6 0%,#FF8FB4 32%,#A78BFA 66%,#4FC7C7 100%);}
.ice-cream-top{
  position:absolute;left:50%;top:-8px;width:58px;height:25px;
  transform:translateX(-50%) rotate(-4deg);pointer-events:none;z-index:2;
}
.cream-puff{
  position:absolute;bottom:0;width:22px;height:22px;border-radius:50%;
  background:radial-gradient(circle at 35% 30%,#FFFFFF,#FFE8F2);
  border:2px solid #B96B87;
}
.cream-puff.p1{left:3px;}
.cream-puff.p2{left:15px;bottom:3px;width:26px;height:26px;}
.cream-puff.p3{right:2px;}
.cherry{
  position:absolute;left:50%;top:-9px;width:13px;height:13px;border-radius:50%;
  background:radial-gradient(circle at 32% 28%,#FFD0D5,#FF6B81 65%,#E84763);
  border:2px solid #8A3B4E;box-shadow:0 2px 0 rgba(90,40,60,.25);
}
.cherry::after{
  content:'';position:absolute;left:6px;top:-9px;width:2px;height:9px;
  background:#5FAE84;border-radius:2px;transform:rotate(16deg);transform-origin:bottom center;
}
.drip{
  position:absolute;bottom:5px;width:11px;height:15px;z-index:2;
  background:linear-gradient(180deg,#FFD3E4,#FFB1CC);
  border:2px solid #A95373;border-top:0;border-radius:0 0 8px 8px;
}
.drip::after{
  content:'';position:absolute;left:50%;bottom:-4px;width:11px;height:11px;
  border-radius:50%;background:#FFB1CC;border:2px solid #A95373;border-top:0;
  transform:translateX(-50%);
}
.d1{left:22%;height:13px;transform:rotate(4deg);}
.d2{left:52%;height:19px;transform:rotate(-3deg);}
.d3{right:18%;height:14px;transform:rotate(5deg);}
.sprinkle{
  position:absolute;width:13px;height:3px;border-radius:3px;
  background:var(--c);transform:rotate(var(--r));box-shadow:0 1px 0 rgba(255,255,255,.7);
}
.s1{left:7%;top:9px;--c:#6BC8AC;--r:-24deg;}
.s2{left:19%;top:4px;--c:#FFE08A;--r:18deg;}
.s3{left:44%;top:7px;--c:#8FD3F4;--r:-12deg;}
.s4{right:28%;top:3px;--c:#FFB1CC;--r:26deg;}
.s5{right:12%;top:10px;--c:#FFE08A;--r:-18deg;}
.s6{left:33%;top:12px;--c:#B6E3A3;--r:35deg;}
.phone-line{
  margin-top:10px;padding:6px 15px;border-radius:999px;
  background:linear-gradient(180deg,#FFF6DC,#FFE3B0);
  border:3px solid #fff;color:#9A5A32;font-size:12px;font-weight:900;letter-spacing:.5px;
  box-shadow:0 5px 0 #D5A565,0 9px 14px rgba(90,50,25,.25);
  transform:translateZ(16px);
}
.home-bottom{transform:translateZ(18px);}
.cloud-note{box-shadow:0 5px 0 rgba(138,90,56,.42),0 11px 17px rgba(60,35,18,.22);}
.big-btn{
  position:relative;transform:translateZ(18px) rotateX(3deg);
  color:#743850;text-shadow:0 2px 0 rgba(255,255,255,.45);
  background:linear-gradient(180deg,#FFD9E4 0%,#FFB3C9 45%,#F58FAE 100%);
  box-shadow:inset 0 3px 0 rgba(255,255,255,.7),inset 0 -5px 0 rgba(150,60,90,.16),0 8px 0 #C96F8D,0 16px 22px rgba(90,40,60,.32);
}
.big-btn.alt{background:linear-gradient(180deg,#FFE7B8,#FFC978);color:#7A4A20;box-shadow:inset 0 3px 0 rgba(255,255,255,.65),0 8px 0 #C58C2E,0 16px 22px rgba(60,35,18,.3);}
.big-btn.ghost{background:linear-gradient(180deg,#FFF6E6,#F6E2C4);color:#8A5A38;box-shadow:inset 0 3px 0 rgba(255,255,255,.7),0 8px 0 #D5B283,0 16px 20px rgba(60,35,18,.26);}
.big-btn:active{transform:translateZ(18px) rotateX(3deg) translateY(6px) scale(.97);}
#startBtn{animation:btnFloat 1.5s ease-in-out infinite,btnGlow 1.5s ease-out infinite;}
#startBtn::before,#startBtn::after{
  content:'✦';position:absolute;font-size:20px;color:#FFF3A8;
  text-shadow:0 0 9px #FFD45E,0 2px 0 #C58C2E;pointer-events:none;
  animation:twinkle 1.1s ease-in-out infinite alternate;
}
#startBtn::before{left:-19px;top:-12px;}
#startBtn::after{right:-17px;bottom:-8px;font-size:15px;animation-delay:.4s;}
@keyframes btnFloat{
  0%,100%{transform:translateZ(18px) rotateX(3deg) translateY(0) rotate(-1.5deg) scale(1);}
  50%{transform:translateZ(18px) rotateX(3deg) translateY(-7px) rotate(1.5deg) scale(1.04);}
}
@keyframes btnGlow{
  0%,100%{box-shadow:inset 0 3px 0 rgba(255,255,255,.7),inset 0 -5px 0 rgba(150,60,90,.16),0 8px 0 #C96F8D,0 0 0 0 rgba(255,190,214,.8),0 16px 22px rgba(90,40,60,.32);}
  50%{box-shadow:inset 0 3px 0 rgba(255,255,255,.7),inset 0 -5px 0 rgba(150,60,90,.16),0 8px 0 #C96F8D,0 0 0 16px rgba(255,190,214,0),0 16px 22px rgba(90,40,60,.32);}
}
@keyframes twinkle{from{opacity:.35;transform:scale(.7) rotate(-15deg);}to{opacity:1;transform:scale(1.25) rotate(15deg);}}
@media (prefers-reduced-motion:reduce){
  #startBtn{animation:none;box-shadow:inset 0 3px 0 rgba(255,255,255,.7),0 8px 0 #C96F8D,0 0 0 8px rgba(255,190,214,.5),0 16px 22px rgba(90,40,60,.32);}
  #startBtn::before,#startBtn::after{animation:none;opacity:1;}
}
/* HUD / 面板 3D */
.stat .val{text-shadow:0 2px 0 #5E3A22,0 4px 6px rgba(0,0,0,.3);}
#comboBadge{box-shadow:inset 0 2px 0 rgba(255,255,255,.32),0 4px 0 rgba(60,35,18,.32);}
#comboBadge.hot{box-shadow:inset 0 2px 0 rgba(255,255,255,.6),0 4px 0 #C58C2E,0 0 18px rgba(255,214,110,.9);}
#hearts img{filter:drop-shadow(0 3px 1px rgba(0,0,0,.35));}
.icobtn{box-shadow:inset 0 2px 0 rgba(255,255,255,.38),0 4px 0 rgba(60,35,18,.38);}
.overlay{perspective:900px;}
.card{
  position:relative;transform:rotateX(3deg);
  box-shadow:inset 0 3px 0 rgba(255,255,255,.85),0 12px 0 rgba(94,58,34,.42),0 24px 38px rgba(40,24,12,.38);
}
.card>*{position:relative;z-index:1;}
.result-box div,.grow,.rank{box-shadow:inset 0 2px 0 rgba(255,255,255,.7),0 4px 0 rgba(138,90,56,.3);}
.emoji-art{filter:drop-shadow(0 6px 4px rgba(60,35,18,.25));}
</style>
</head>
<body>
<div id="wrap">
  <canvas id="game"></canvas>

  <!-- HOME -->
  <div id="home">
    <div class="home-top">
      <img id="logo" alt="Rainbow Ice Parlour & Coffee House">
      <div class="title-bubble">
        <div class="ice-title">
          <span class="tline l1"><span class="word w1">Catch</span><span class="word w2">the</span></span>
          <span class="tline l2"><span class="word w3">Cendol</span></span>
          <span class="ice-cream-top"><i class="cream-puff p1"></i><i class="cream-puff p2"></i><i class="cream-puff p3"></i><i class="cherry"></i></span>
          <i class="drip d1"></i><i class="drip d2"></i><i class="drip d3"></i>
          <i class="sprinkle s1"></i><i class="sprinkle s2"></i><i class="sprinkle s3"></i>
          <i class="sprinkle s4"></i><i class="sprinkle s5"></i><i class="sprinkle s6"></i>
        </div>
      </div>
      <div class="phone-line">手机下单 · 0169402647</div>
    </div>
    <div class="home-bottom">
      <div class="cloud-note">来吃碗Cendol啦！</div>
      <button class="big-btn" id="startBtn">开始营业</button>
    </div>
  </div>

  <!-- HUD -->
  <div id="hud" class="hidden">
    <div class="stat">
      <span class="lbl">SCORE</span><span class="val" id="score">0</span>
      <span class="lbl" style="margin-top:3px">BEST <b class="best" id="best">0</b></span>
    </div>
    <div class="hud-mid"><div id="comboBadge">COMBO <b id="combo">0</b> <span id="mult">×1</span></div></div>
    <div class="hud-right">
      <div id="hearts"></div>
      <div class="icon-row">
        <button class="icobtn" id="guideBtn" title="玩法图鉴">?</button>
        <button class="icobtn" id="pauseBtn" title="暂停">
          <svg viewBox="0 0 24 24"><rect x="5" y="4" width="5" height="16" rx="1.5"/><rect x="14" y="4" width="5" height="16" rx="1.5"/></svg>
        </button>
        <button class="icobtn" id="soundBtn" title="音效开关">
          <svg viewBox="0 0 24 24"><path d="M4 9v6h4l5 4V5L8 9H4zm12.5-1.5a5 5 0 010 9v-2.2a3 3 0 000-4.6V7.5z"/></svg>
        </button>
      </div>
    </div>
  </div>

  <!-- GUIDE -->
  <div id="guideScreen" class="overlay hidden">
    <div class="card">
      <h2>玩法图鉴</h2>
      <div class="guide-grid" id="guideGrid"></div>
      <p class="tip">接住食材累积连击，每 5 连击提升倍率，最高 ×3！<br>漏掉食材会断连击，危险物会扣爱心。</p>
      <div class="btn-stack"><button class="big-btn alt" id="closeGuideBtn">知道啦</button></div>
    </div>
  </div>

  <!-- PAUSE -->
  <div id="pauseScreen" class="overlay hidden">
    <div class="card">
      <div class="emoji-art"><canvas id="pauseArt" width="152" height="152"></canvas></div>
      <h2>休息一下～</h2>
      <p>冰碗先放这儿，等你回来继续营业！</p>
      <div class="btn-stack">
        <button class="big-btn" id="resumeBtn">继续游戏</button>
        <button class="big-btn ghost" id="pauseHomeBtn">返回首页</button>
      </div>
    </div>
  </div>

  <!-- GAME OVER -->
  <div id="overScreen" class="overlay hidden">
    <div class="card">
      <canvas class="emoji-art" id="overArt" width="152" height="152"></canvas>
      <h2>打烊啦！</h2>
      <div id="newBest" class="newbest hidden">★ 新纪录 NEW BEST! ★</div>
      <div class="result-box">
        <div><span>本局得分</span><b id="finalScore">0</b></div>

/* 从边缘 floods-fill 抠掉公鸡碗底色 */
function keyBg(img,tol){
  const c=document.createElement('canvas');
  const iw=img.naturalWidth||img.width, ih=img.naturalHeight||img.height;
  c.width=iw;c.height=ih;
  const x=c.getContext('2d');x.drawImage(img,0,0,iw,ih);
  const id=x.getImageData(0,0,c.width,c.height),d=id.data,w=c.width,h=c.height;
  const corners=[[0,0],[w-1,0],[0,h-1],[w-1,h-1]].map(([px,py])=>{
    const i=(py*w+px)*4;return [d[i],d[i+1],d[i+2]];
  });
  const seen=new Uint8Array(w*h),stack=[];
  for(let i=0;i<w;i++){stack.push(i,i+(h-1)*w);}
  for(let j=0;j<h;j++){stack.push(j*w,j*w+w-1);}
  while(stack.length){
    const idx=stack.pop();if(seen[idx])continue;seen[idx]=1;
    const p=idx*4,r=d[p],g=d[p+1],b=d[p+2];
    let hit=false;
    for(const cr of corners){
      if(Math.abs(r-cr[0])+Math.abs(g-cr[1])+Math.abs(b-cr[2])<(tol||135)){hit=true;break;}
    }
    if(!hit)continue;
    d[p+3]=0;
    const xx=idx%w,yy=(idx/w)|0;
    if(xx>0)stack.push(idx-1);
    if(xx<w-1)stack.push(idx+1);
    if(yy>0)stack.push(idx-w);
    if(yy<h-1)stack.push(idx+w);
  }
  x.putImageData(id,0,0);return c;
}
/* 按 alpha 裁剪透明边缘 */
function trimCanvas(src,pad){
  const id=src.getContext('2d').getImageData(0,0,src.width,src.height).data;
  let minX=src.width,minY=src.height,maxX=-1,maxY=-1;
  for(let y=0;y<src.height;y++){
    for(let x=0;x<src.width;x++){
      if(id[(y*src.width+x)*4+3]>12){
        if(x<minX)minX=x;if(x>maxX)maxX=x;
        if(y<minY)minY=y;if(y>maxY)maxY=y;
      }
    }
  }
  if(maxX<0)return src;
  pad=pad||0;
  minX=Math.max(0,minX-pad);minY=Math.max(0,minY-pad);
  maxX=Math.min(src.width-1,maxX+pad);maxY=Math.min(src.height-1,maxY+pad);
  const c=document.createElement('canvas');
  c.width=maxX-minX+1;c.height=maxY-minY+1;
  c.getContext('2d').drawImage(src,minX,minY,c.width,c.height,0,0,c.width,c.height);
  return c;
}

/* 首页背景：手绘可爱 3D 马来西亚小店 */
function roundRectPath(x,px,py,w,h,r){
  x.beginPath();
  if(x.roundRect){x.roundRect(px,py,w,h,r);return;}
  x.moveTo(px+r,py);x.arcTo(px+w,py,px+w,py+h,r);x.arcTo(px+w,py+h,px,py+h,r);
  x.arcTo(px,py+h,px,py,r);x.arcTo(px,py,px+w,py,r);x.closePath();
}
function makeShopScene(){
  const c=document.createElement('canvas');c.width=840;c.height=1440;
  const x=c.getContext('2d');x.scale(2,2);
  const sky=x.createLinearGradient(0,0,0,720);
  sky.addColorStop(0,'#FFE9C8');sky.addColorStop(.45,'#FFF4DE');sky.addColorStop(1,'#F2CFA0');
  x.fillStyle=sky;x.fillRect(0,0,420,720);
  const sun=x.createRadialGradient(352,110,8,352,110,130);
  sun.addColorStop(0,'rgba(255,247,205,.92)');sun.addColorStop(1,'rgba(255,247,205,0)');
  x.fillStyle=sun;x.fillRect(220,0,200,250);
  const cloud=(cx,cy,s)=>{

/* ============ 音效 ============ */
let actx=null,master=null;
function initAudio(){
  try{
    if(!actx){const AC=window.AudioContext||window.webkitAudioContext;if(!AC)return;
      actx=new AC();master=actx.createGain();master.gain.value=muted?0:1;master.connect(actx.destination);}
    if(actx.state==='suspended')actx.resume();
  }catch(e){}
}
function tone(f,dur,type,vol,delay,end,dest){
  if(!actx||muted||!master)return;
  try{
    const t=actx.currentTime+(delay||0),o=actx.createOscillator(),g=actx.createGain();
    o.type=type||'sine';o.frequency.setValueAtTime(f,t);
    if(end)o.frequency.exponentialRampToValueAtTime(Math.max(1,end),t+dur);
    g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(vol||.12,t+.012);
    g.gain.exponentialRampToValueAtTime(.0001,t+dur);
    o.connect(g);g.connect(dest||master);o.start(t);o.stop(t+dur+.03);
  }catch(e){}
}
function noise(dur,vol,type,freq){
  if(!actx||muted||!master)return;
  try{
    const len=Math.max(1,Math.floor(actx.sampleRate*dur));
    const buf=actx.createBuffer(1,len,actx.sampleRate),data=buf.getChannelData(0);
    for(let i=0;i<len;i++)data[i]=(Math.random()*2-1)*(1-i/len);
    const s=actx.createBufferSource();s.buffer=buf;
    const f=actx.createBiquadFilter();f.type=type;f.frequency.value=freq;
    const g=actx.createGain();g.gain.value=vol;
    s.connect(f);f.connect(g);g.connect(master);s.start();
  }catch(e){}
}
const sfx={
  coconut(){tone(210,.16,'sine',.14,0,130);noise(.08,.05,'lowpass',900);},
  cendol(){tone(520,.14,'sine',.12,0,760);tone(660,.12,'sine',.09,.08,900);},
  condensed(){[523,659,784].forEach((f,i)=>tone(f,.2,'triangle',.09,i*.05));},
  gula(){[784,988,1319].forEach((f,i)=>tone(f,.3,'triangle',.1,i*.045));},
  icecream(){[880,1175,1568].forEach((f,i)=>tone(f,.16,'sine',.09,i*.04));tone(1760,.08,'sine',.05,.12);},
  roach(){tone(300,.3,'sawtooth',.07,0,140);tone(240,.26,'sine',.06,.04,110);},
  uncle(){tone(180,.24,'sawtooth',.12,0,90);noise(.16,.09,'lowpass',900);},
  combo(){tone(660,.1,'square',.05);tone(880,.1,'square',.05,.09);tone(1175,.2,'triangle',.09,.18);},
  over(){[440,370,294,220].forEach((f,i)=>tone(f,.3,'triangle',.11,i*.14));}
};

/* ============ 背景音乐：纯合成轻快循环 ============ */
let bgmGain=null,bgmTimer=null,bgmStep=0,bgmOn=false,bgmDuck=false;
const MELODY=[659,784,988,784,659,587,659,0,784,988,1175,988,784,659,587,0];
const BASS=[131,0,98,0,110,0,98,0,131,0,147,0,110,0,98,0];
function bgmLevel(){return muted?0:(bgmDuck?.024:.075);}
function fadeBGM(v){
  if(!bgmGain||!actx)return;
  try{bgmGain.gain.cancelScheduledValues(actx.currentTime);
    bgmGain.gain.linearRampToValueAtTime(v,actx.currentTime+.3);}catch(e){}
}
function startBGM(){
  initAudio();
  if(!actx||bgmTimer)return;
  if(!bgmGain){bgmGain=actx.createGain();bgmGain.gain.value=0;bgmGain.connect(master);}
  bgmOn=true;
  bgmTimer=setInterval(()=>{
    if(!actx||muted||!bgmOn)return;
    const s=bgmStep%16,f=MELODY[s],b=BASS[s];
    if(f)tone(f,.23,'triangle',.42,0,null,bgmGain);
    if(b)tone(b,.38,'sine',.3,0,null,bgmGain);
    bgmStep++;
  },270);
  fadeBGM(bgmLevel());
}
function setBGM(active){bgmOn=active;fadeBGM(active?bgmLevel():0);}
function duckBGM(on){bgmDuck=on;fadeBGM(bgmOn?bgmLevel():0);}

/* ============ 特效与逻辑 ============ */
function burst(x,y,color,n){
  for(let i=0;i<n;i++){
    const a=rand(0,Math.PI*2),s=rand(70,250);
    particles.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s-40,life:rand(.35,.8),max:.8,color,size:rand(2,5)});
  }
}
function floatText(x,y,text,color,size){floaters.push({x,y,text,color,size,life:1,max:1});}

function spawn(){
  const k=POOL[(Math.random()*POOL.length)|0];
  const d=ITEMS[k],r=d.r;
  items.push({k,d,x:rand(r+14,W-r-14),y:-r-6,prevY:-r-6,
    vy:(92+diff()*168)*d.spd*rand(.94,1.08),r,
    rot:rand(-.18,.18),rotV:rand(-.9,.9),phase:rand(0,6.28)});
}
function catchItem(it){
  const d=it.d;
  burst(it.x,it.y+4,d.color,d.rare?22:12);
  sfx[it.k]?sfx[it.k]():sfx.coconut();
  if(d.kind==='good'){
    combo++;
    if(combo%5===0){
      multiplier=Math.min(3,1+Math.floor(combo/5)*.5);
      goldGlow=1.4;
      floatText(player.x,player.y-24,'COMBO x'+combo+'!','#FFD76A',19);
      sfx.combo();
    }
    const g=Math.round(d.pts*multiplier);
    score+=g;
    floatText(it.x,it.y,'+'+g+'!',d.rare?'#FFD76A':'#FFFFFF',d.rare?23:18);
  }else{
    hearts--;combo=0;multiplier=1;
    shake=it.k==='uncle'?16:11;redFlash=.5;
    burst(it.x,it.y,'#FF6B5E',16);
    floatText(it.x,it.y,'−1 爱心','#FF6B6B',21);
    if(it.k==='uncle')floatText(it.x,it.y-26,'Uncle 生气啦!','#FFD76A',14);
    else floatText(it.x,it.y-26,'蟑螂来袭!','#FFD76A',14);
  }
  updateHUD();if(hearts<=0)endGame();
}

/* ============ 更新 ============ */
function update(dt){
  if(goldGlow>0)goldGlow=Math.max(0,goldGlow-dt);
  if(shake>0)shake=Math.max(0,shake-dt*38);
  if(redFlash>0)redFlash=Math.max(0,redFlash-dt*1.35);
  for(let i=particles.length-1;i>=0;i--){
    const p=particles[i];p.life-=dt;p.vy+=330*dt;p.x+=p.vx*dt;p.y+=p.vy*dt;
    if(p.life<=0)particles.splice(i,1);
  }
  for(let i=floaters.length-1;i>=0;i--){
    const f=floaters[i];f.life-=dt*.95;f.y-=42*dt;if(f.life<=0)floaters.splice(i,1);
  }
  if(state!=='PLAYING')return;
  elapsed+=dt;

  if(keyLeft||keyRight){
    const dir=(keyRight?1:0)-(keyLeft?1:0);
    player.x+=dir*player.speed*dt;player.targetX=player.x;lastPointer=-9999;
  }else if(performance.now()-lastPointer<280){player.x=player.targetX;}
  else{player.x+=(player.targetX-player.x)*Math.min(1,dt*18);}
  player.x=clamp(player.x,player.w/2+4,W-player.w/2-4);

  spawnTimer-=dt;
  if(spawnTimer<=0){spawn();spawnTimer=(1.25-diff()*.55)*rand(.82,1.18);}

  const line=player.y+16;
  for(let i=items.length-1;i>=0;i--){
    const it=items[i];
    it.prevY=it.y;it.y+=it.vy*dt;it.rot+=it.rotV*dt;
    it.x+=Math.sin(elapsed*2.6+it.phase)*10*dt;
    it.x=clamp(it.x,it.r,W-it.r);
    if(it.prevY<line&&it.y>=line&&Math.abs(it.x-player.x)<player.w/2+it.r*.28){
      catchItem(it);items.splice(i,1);
      if(state!=='PLAYING')break;
      continue;
    }
    if(it.y>H+it.r+20){
      if(it.d.kind==='good'&&combo>0){combo=0;multiplier=1;updateHUD();}
      items.splice(i,1);
    }
  }
}

/* ============ 卡通绘图工具 ============ */
function C(fill,stroke,lw){if(fill){ctx.fillStyle=fill;ctx.fill();}if(stroke){ctx.strokeStyle=stroke;ctx.lineWidth=lw||3;ctx.stroke();}}
function circle(x,y,r){ctx.beginPath();ctx.arc(x,y,r,0,Math.PI*2);}
function rrect(x,y,w,h,r){ctx.beginPath();ctx.roundRect(x,y,w,h,r);}
function eye(x,y,s,angry){
  if(angry){
    ctx.strokeStyle='#4A3020';ctx.lineWidth=3;ctx.lineCap='round';
    ctx.beginPath();ctx.moveTo(x-6,y-(angry?5:0));ctx.lineTo(x+5,y+(angry?1:-3));ctx.stroke();
  }
  circle(x,y,s);C('#3B2A20');
  circle(x-.8,y-.9,s*.35);C('#fff',null);
}

      ctx.beginPath();ctx.moveTo(-28,-26);ctx.lineTo(-16,-40);ctx.lineTo(16,-40);ctx.lineTo(28,-26);ctx.closePath();C('#E9F7F2','#6C4423',4);

}

function drawCloud(x,y,w,h,a){
  ctx.save();ctx.globalAlpha=a||.7;

  ctx.beginPath();ctx.arc(x-w*.25,y+4,w*.22,0,7);ctx.arc(x,y-w*.12+4,w*.28,0,7);ctx.arc(x+w*.26,y+4,w*.2,0,7);
  ctx.rect(x-w*.36,y+4,w*.72,h*.36);ctx.fill();
  ctx.fillStyle='#FFFFFF';
  ctx.beginPath();ctx.arc(x-w*.25,y,w*.22,0,7);ctx.arc(x,y-w*.12,w*.28,0,7);ctx.arc(x+w*.26,y,w*.2,0,7);
  ctx.rect(x-w*.36,y,w*.72,h*.36);ctx.fill();ctx.restore();
}

  ctx.restore();
  // 透视瓷砖

  for(let y=470;y<H;y+=40){ctx.beginPath();ctx.moveTo(0,y);ctx.lineTo(W,y);ctx.stroke();}

  // 闪光

    const px=(i*97+40)%W,py=(t*18+i*83)%(H-110)+110;

function drawBowl(){
  const {x,y,w,h}=player;

    const a=Math.min(1,(multiplier-1)/2+goldGlow*.4);

    ctx.strokeStyle='rgba(255,214,94,'+(.45+a*.5)+')';ctx.lineWidth=4;

/* ============ 渲染 ============ */
function render(t){
  ctx.save();
  if(shake>0)ctx.translate(rand(-shake,shake),rand(-shake,shake));
  drawBackground(t);
  for(const it of items)drawItem(it);
  for(const p of particles){ctx.globalAlpha=Math.max(0,p.life/p.max);ctx.fillStyle=p.color;ctx.beginPath();ctx.arc(p.x,p.y,p.size,0,7);ctx.fill();}
  ctx.globalAlpha=1;
  drawBowl();
  for(const f of floaters){
    ctx.globalAlpha=Math.max(0,f.life/f.max);
    ctx.font='900 '+f.size+'px "PingFang SC","Microsoft YaHei",sans-serif';
    ctx.textAlign='center';ctx.textBaseline='middle';
    ctx.lineWidth=4;ctx.strokeStyle='rgba(94,58,34,.7)';ctx.strokeText(f.text,f.x,f.y);
    ctx.fillStyle=f.color;ctx.fillText(f.text,f.x,f.y);
  }
  ctx.globalAlpha=1;
  if(redFlash>0){
    ctx.fillStyle='rgba(255,50,45,'+(redFlash*.4)+')';ctx.fillRect(-20,-20,W+40,H+40);
    ctx.strokeStyle='rgba(255,60,55,'+redFlash+')';ctx.lineWidth=8;ctx.strokeRect(4,4,W-8,H-8);
  }
  ctx.restore();
}
let last=0;
function loop(ts){
  const dt=Math.min(.034,(ts-last)/1000||0);last=ts;
  update(dt);render(ts/1000);requestAnimationFrame(loop);
}
requestAnimationFrame(loop);

function buildGuide(){
  const grid=$('guideGrid');grid.innerHTML='';
  for(const k in ITEMS){
    const d=ITEMS[k];
    const row=document.createElement('div');row.className='grow';
    const cv=document.createElement('canvas');cv.width=100;cv.height=100;
    const cx=cv.getContext('2d');cx.translate(50,50);
    drawArtTo(cx,k,0,0,1.45);
    row.appendChild(cv);
    const nm=document.createElement('div');nm.className='nm';nm.textContent=d.name;
    const pt=document.createElement('div');pt.className='pt';
    pt.textContent=d.kind==='good'?'+'+d.pts:'-1 爱心';
    row.appendChild(nm);row.appendChild(pt);grid.appendChild(row);
  }
}
buildGuide();

/* ============ 输入 ============ */
function setTarget(cx){
  const r=wrap.getBoundingClientRect();
  player.targetX=clamp((cx-r.left)/r.width*W,0,W);
  lastPointer=performance.now();
}
wrap.addEventListener('pointermove',e=>{if(state==='PLAYING')setTarget(e.clientX);});
wrap.addEventListener('pointerdown',e=>{if(state==='PLAYING')setTarget(e.clientX);});
wrap.addEventListener('touchmove',e=>{if(state==='PLAYING'&&e.touches.length){setTarget(e.touches[0].clientX);e.preventDefault();}},{passive:false});
window.addEventListener('keydown',e=>{
  const k=e.key.toLowerCase();
  if(k==='arrowleft'||k==='a'){keyLeft=true;if(state==='PLAYING')e.preventDefault();}
  if(k==='arrowright'||k==='d'){keyRight=true;if(state==='PLAYING')e.preventDefault();}
  if((k==='escape'||k==='p')){
    if(state==='PLAYING')pauseGame();else if(state==='PAUSED')resumeGame();
  }
  if((k==='enter'||k===' ')&&state==='HOME'){e.preventDefault();startGame();}
});
window.addEventListener('keyup',e=>{
  const k=e.key.toLowerCase();
  if(k==='arrowleft'||k==='a')keyLeft=false;
  if(k==='arrowright'||k==='d')keyRight=false;
});

$('startBtn').addEventListener('click',e=>{e.stopPropagation();startGame();});
$('pauseBtn').addEventListener('click',e=>{e.stopPropagation();pauseGame();});
$('resumeBtn').addEventListener('click',resumeGame);
$('pauseHomeBtn').addEventListener('click',showHome);
$('restartBtn').addEventListener('click',startGame);
$('overHomeBtn').addEventListener('click',showHome);
$('guideBtn').addEventListener('click',e=>{
  e.stopPropagation();
  guideReturn=state==='PLAYING'?'PLAYING':state;
  if(state==='PLAYING'){state='PAUSED';setBGM(false);}
  $('guideScreen').classList.remove('hidden');
});
$('closeGuideBtn').addEventListener('click',()=>{
  $('guideScreen').classList.add('hidden');
  if(guideReturn==='PLAYING'){state='PLAYING';setBGM(true);}
});

updateHUD();
showHome();
})();
</script>
</body>
</html>
